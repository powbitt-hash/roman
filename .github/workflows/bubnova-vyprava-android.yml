name: Bubnova vyprava - Android APK

# Spúšťa sa ručne (GitHub > Actions > tento workflow > Run workflow) alebo pri každom pushi do vetvy prototypu.
on:
  workflow_dispatch:
  push:
    branches: [prototyp-android]
    paths: ['bubnova-vyprava/**', '.github/workflows/bubnova-vyprava-android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bubnova-vyprava
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Cislo verzie
        run: echo "BUILD_VERSION=${{ github.run_number }} ($(TZ=Europe/Bratislava date +'%-d. %-m. %H:%M'))" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx cap add android
      - name: Verzia v Androide
        run: sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "0.${{ github.run_number }}"/' android/app/build.gradle && grep -q 'versionCode ${{ github.run_number }}' android/app/build.gradle
      - name: Povolenie mikrofonu
        run: sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' android/app/src/main/AndroidManifest.xml
      - name: Kontrola povolenia mikrofonu
        run: grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml && grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
      - name: Surovy mikrofon (nativny plugin)
        run: |
          D=android/app/src/main/java/sk/bubnovavyprava/app
          cp native/RawMicPlugin.java "$D/"
          cat > "$D/MainActivity.java" <<'EOF'
          package sk.bubnovavyprava.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(RawMicPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          grep -q registerPlugin "$D/MainActivity.java"
      - run: npx cap sync android
      - name: Stale podpisovanie (aktualizacia bez odinstalovania)
        run: mkdir -p ~/.android && cp native/debug.keystore ~/.android/debug.keystore
      - name: Zostavenie APK
        working-directory: bubnova-vyprava/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Pomenovanie APK podla verzie
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bubnova-vyprava-v${{ github.run_number }}.apk
      - name: Kontrola podpisu (musi byt stale rovnaky kluc)
        working-directory: bubnova-vyprava
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $AS verify --verbose --print-certs bubnova-vyprava-v${{ github.run_number }}.apk | tee cert.txt
          grep -qi "c8a68b72cfeca04fc25e3f8793866f0564b76924b6ef48f82d120b0e89f3331b" cert.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bubnova-vyprava-apk-${{ github.run_number }}
          path: bubnova-vyprava/bubnova-vyprava-v${{ github.run_number }}.apk
